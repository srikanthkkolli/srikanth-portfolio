name: Angular Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pipeline-start:
    name: 🛠️ Initialize Pipeline
    runs-on: ubuntu-latest
    steps:
      - run: echo "Starting pipeline..."

  lint:
    name: 🎨 Lint
    runs-on: ubuntu-latest
    needs: pipeline-start
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: pipeline-start
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run build --if-present

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: pipeline-start
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - name: 📋 Run Unit Tests
        run: |
          echo "::group::Running Angular Tests"
          npm test -- --watch=false --browsers=ChromeHeadless --source-map=false
          echo "::endgroup::"

  audit:
    name: 🔐 Audit
    runs-on: ubuntu-latest
    needs: pipeline-start
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --audit-level=high || true

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install
      - run: npm run build -- --base-href /srikanth-portfolio/

      - name: 📦 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/srikanth-portfolio
